openapi: 3.0.3
info:
  title: MoneyGuard API
  version: 1.0.0
  description: |
    Backend for MoneyGuard: balance, bills and expenses tracking, a daily "safe to spend" figure,
    and affordability calculators.

    **Conventions**
    - JSON everywhere. Send `Content-Type: application/json` (except file upload).
    - Money is a plain number with up to 2 decimals (e.g. `250.75`; extra decimals are rounded to cents). Numeric strings like `"250.75"` are accepted on input; responses always use numbers. Amounts that must be positive have a minimum of `0.01`.
    - Dates are ISO 8601 and must be real calendar dates between 1900 and 2200. Send `2026-12-01` (taken as UTC midnight) or a date-time **with a time zone**: `2026-12-01T09:00:00Z` or `2026-12-01T09:00:00+05:30`. A date-time without a zone, or an impossible date such as `2026-02-30`, is rejected with a 400. Responses use full UTC timestamps.
    - Errors are `{ "error": "message" }`. Validation errors (400) add `details`: one entry per bad field.
    - Every response has an `X-Request-Id` header. Quote it when reporting a problem.
    - **Idempotency:** on any POST/PUT/DELETE send an `Idempotency-Key` header (e.g. a UUID, max 128 chars) so that a retry after a network failure cannot create a duplicate. A replayed response carries `Idempotent-Replayed: true`. GET requests ignore the header (they always return fresh data). Server errors (5xx) and rate-limit responses are never stored, so those can be retried.
    - **Rate limits** (per client IP): 8 failed login/register attempts per 15 min; 30 writes, 20 calculator calls and 60 reads per minute. On `429`, wait and retry; the `RateLimit-*` headers say when.
servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
  - name: Profile
  - name: Bills
  - name: Expenses
  - name: Analytics
  - name: Alerts
  - name: Files
  - name: Dashboard
  - name: Calculators
  - name: Platform

paths:
  /health:
    get:
      tags: [Platform]
      summary: Liveness and database check
      description: Not rate limited and not authenticated. Returns 503 when the database is unreachable.
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Wrong email or password (the same answer for both, on purpose)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Get a new access token
      description: |
        Access tokens last 1 hour. Call this when one has expired (a 401 on any request) or is about to, and the user stays signed in for as long as refresh tokens keep being used. Each refresh token works **once**: the response
        carries a new one that replaces it, so always store the latest. Each refresh token is valid for 7 days from when it was issued, and every refresh issues a fresh 7 days, so a user who opens the app at least once a week stays signed in and an unused login ends after 7 days.
        Sending an already-used refresh token ends that whole login (every token from it), because it probably leaked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshInput' }
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Unknown, expired or already used refresh token. Log in again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Revokes the refresh token and every token issued from the same login. Always succeeds. The access token stays valid until it expires.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshInput' }
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset
      description: |
        Sends the account's email a reset token that works once for 60 minutes. A new request replaces any earlier token.
        The answer is the same whether or not the email has an account. Limited to 8 requests per 15 minutes per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordInput' }
      responses:
        '200':
          description: Accepted (always, whether or not the account exists)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with a reset token
      description: Also logs the user out everywhere. All refresh tokens are revoked and access tokens issued before the reset stop working, so log in again with the new password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordInput' }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: Invalid input (with `details`), or the reset token is unknown, expired or already used
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/ValidationError' }
                  - { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/me/password:
    put:
      tags: [Profile]
      summary: Change my password
      description: |
        Needs the current password. On success the password changes and **every other login is ended** (all refresh tokens, and
        access tokens issued before now). A fresh session for this device is returned: **replace the stored tokens with it**,
        or the user will be logged out on the next request.

        A wrong current password is a **400** with `details` naming `currentPassword` (not a 401, which would make apps
        think the login token is bad). Wrong guesses count towards the limit of 8 failed attempts per 15 minutes.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordInput' }
      responses:
        '200':
          description: Changed. The new session for this device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/me/avatar:
    put:
      tags: [Profile]
      summary: Set or replace my profile picture
      description: |
        Multipart form with one field named `avatar`: an image (JPEG, PNG, WebP or GIF), at most 5 MB. The answer has the
        link to show. With Cloudinary configured it is an `https://res.cloudinary.com/...` link; otherwise it is a path on this
        server (`/uploads/...`), so put the server's address in front of it. The previous picture is deleted. The link is also
        `avatarUrl` on `GET /api/me` and in the login and register answers.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [avatarUrl]
                properties:
                  avatarUrl: { type: string, example: 'https://res.cloudinary.com/your-cloud/image/upload/v1/moneyguard/USER_ID/avatar/abc123.png' }
        '400':
          description: No image sent, the wrong form field, not an image, or larger than 5 MB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Profile]
      summary: Remove my profile picture
      description: Deletes the stored picture and clears `avatarUrl`. Safe to repeat.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [avatarUrl]
                properties:
                  avatarUrl: { type: string, nullable: true, example: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/financial-profile:
    get:
      tags: [Profile]
      summary: Get the saved calculator numbers
      description: |
        The numbers the user typed into the calculators (monthly income, expenses, loan payments and so on), remembered
        between logins. Call this after login to pre-fill the calculator screens. If nothing has been saved yet the
        defaults come back (not an error) and `updatedAt` is null.

        How the fields map onto the calculators:

        | Field | projected-balance | cash-flow | affordability |
        |---|---|---|---|
        | `monthlyIncome` | `monthlyIncome` | `monthlyGrossIncome` | `monthlyGrossIncome` |
        | `monthlyExpenses` | `ordinaryExpenses` | `otherMonthlyExpenses` | `otherMonthlyExpenses` |
        | `existingDebtPayments` | `existingEMI` | `existingMonthlyDebtPayments` | `existingMonthlyDebtPayments` |
        | `proposedPayment` | `proposedEMI` | `monthlyPayment` | `proposedMonthlyPayment` |
        | `targetDtiRatio` | | | `targetDtiRatio` |
        | `annualInterestRate` | | | `annualInterestRate` |
        | `loanTermMonths` | | | `loanTermMonths` |
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The saved numbers, or the defaults
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    put:
      tags: [Profile]
      summary: Save the calculator numbers
      description: Send only the fields that changed (at least one). Fields you leave out keep their saved value.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinancialProfileInput' }
      responses:
        '200':
          description: The numbers as saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialProfile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/me/cancel-deletion:
    post:
      tags: [Profile]
      summary: Cancel a pending account deletion
      description: |
        Undoes a deletion that was requested with `DELETE /api/me`, as long as the 24-hour grace period has not ended. The
        account and all its data are exactly as they were. Safe to repeat: an account that is not pending just stays active.
        Once the grace period is over the account is already gone and this answers 401.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: The account is active
          content:
            application/json:
              schema:
                type: object
                required: [accountStatus, requestedAt, deletesAt, message, user]
                properties:
                  accountStatus: { type: string, enum: [active] }
                  requestedAt: { type: string, nullable: true, example: null }
                  deletesAt: { type: string, nullable: true, example: null }
                  message: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/me:
    delete:
      tags: [Profile]
      summary: Delete my account (after a 24-hour grace period)
      description: |
        **The account is not deleted now.** It is scheduled to be permanently deleted **24 hours from now**, and the answer says
        so (`accountStatus: pending_deletion` with `deletesAt` and a `message` to show). During those 24 hours:

        - the account **keeps working**, so the user can see what is happening;
        - `accountStatus` is `pending_deletion` (with `deletionRequestedAt` and `deletesAt`) on `GET /api/me`, in the login
          and register answers, and as `accountDeletion` on `GET /api/dashboard` and in the login answer, so every screen can show a notice;
        - `POST /api/me/cancel-deletion` cancels it and nothing is lost.

        When the 24 hours are over, the profile and **all** its data (bills, expenses, alerts, calculator numbers, tokens, and the
        uploaded files and profile picture) are deleted for good and cannot be recovered. The server removes them automatically
        (a check runs every minute and at start-up), and an account past its deadline is refused at once even before that check
        runs. After that, `401 Account not found` and the email can be registered again.

        Asking again while pending does **not** move the deadline. **Needs the current password** (send it in the JSON body, which
        every common HTTP client supports for DELETE); a wrong one is a `400` naming `currentPassword`, never a 401, and counts
        towards the limit of 8 failed attempts per 15 minutes.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword]
              properties:
                currentPassword: { type: string }
      responses:
        '202':
          description: Accepted. The account is now pending deletion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDeletionPending' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    put:
      tags: [Profile]
      summary: Edit my name, phone or email
      description: |
        Send only the fields that changed (at least one). `name` or `phone` set to `null` or an empty text clears it.
        **Changing the email also needs `currentPassword`** (a stolen login token alone must not be enough to take over an
        account). A wrong current password is a **400** naming `currentPassword`. An email that another account uses is a
        **409**. Nothing else on the account can be changed here: the balance and the other details have their own endpoints.
        Wrong passwords count towards the limit of 8 failed attempts per 15 minutes.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateInput' }
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Email already registered to another account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [Profile]
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/balance:
    put:
      tags: [Profile]
      summary: Set the current balance
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [balance]
              properties:
                balance: { $ref: '#/components/schemas/Money' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [balance]
                properties:
                  balance: { type: number, example: 1000 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/next-income:
    put:
      tags: [Profile]
      summary: Set the next expected income
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                date:
                  type: string
                  format: date-time
                  nullable: true
                  description: When the income arrives. Omit or null if unknown (the app then assumes 30 days).
                  example: '2026-12-01'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [nextIncomeAmount, nextIncomeDate]
                properties:
                  nextIncomeAmount: { type: number, example: 500 }
                  nextIncomeDate: { type: string, format: date-time, nullable: true }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/savings-goal:
    put:
      tags: [Profile]
      summary: Set the savings goal
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                deadline: { type: string, format: date-time, nullable: true, example: '2027-01-01' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [savingsGoalAmount, savingsGoalDeadline]
                properties:
                  savingsGoalAmount: { type: number, example: 200 }
                  savingsGoalDeadline: { type: string, format: date-time, nullable: true }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/bills:
    get:
      tags: [Bills]
      summary: List my bills (oldest first)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Bills
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Bill' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Bills]
      summary: Add a bill
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/bills/{id}:
    put:
      tags: [Bills]
      summary: Edit a bill
      description: Send only the fields that changed (at least one). A `dueDate` of `null` removes the due date.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                amount: { $ref: '#/components/schemas/PositiveMoney' }
                dueDate: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: The updated bill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such bill (or it is not yours)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Bills]
      summary: Delete a bill
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such bill (or it belongs to someone else)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/expenses:
    get:
      tags: [Expenses]
      summary: List my expenses (newest first)
      description: |
        Filter with the query parameters below (all optional, combined with AND). The result is one page; the
        `X-Total-Count` response header is the number of matches across all pages.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, description: 'First day to include, e.g. 2026-10-01 (UTC).', schema: { type: string, format: date } }
        - { name: to, in: query, description: 'Last day to include, e.g. 2026-10-31 (UTC).', schema: { type: string, format: date } }
        - { name: category, in: query, description: 'Exact category, any letter case.', schema: { type: string, maxLength: 50 } }
        - { name: minAmount, in: query, schema: { type: number, minimum: 0.01 } }
        - { name: maxAmount, in: query, schema: { type: number, minimum: 0.01 } }
        - { name: limit, in: query, description: 'Page size.', schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, description: 'How many matches to skip.', schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Expenses
          headers:
            X-Total-Count:
              description: Number of expenses matching the filters, across all pages.
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Expenses]
      summary: Record an expense
      description: Also reduces the balance by the amount, in one atomic step. An expense larger than the balance is refused (422) and nothing changes, even when many requests arrive at once.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: The amount is more than the current balance. Nothing was recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/expenses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Expenses]
      summary: Edit an expense
      description: |
        Send only the fields to change (at least one). If the amount changes, the balance moves by the difference in the
        same atomic step. Raising the amount above what the balance can cover is refused (422) and nothing changes.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseUpdate' }
      responses:
        '200':
          description: The updated expense
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such expense (or it is not yours)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: The new amount is more than the balance allows. Nothing changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Expenses]
      summary: Delete an expense
      description: The expense amount is added back to the balance, in the same atomic step.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok, balance]
                properties:
                  ok: { type: boolean, example: true }
                  balance: { type: number, description: 'The balance after the refund.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such expense (or it is not yours)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/files:
    get:
      tags: [Files]
      summary: List my uploaded files
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FileRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Files]
      summary: Upload a file
      description: |
        Multipart form with one field named `file`. Allowed: JPEG, PNG, WebP, GIF, PDF, MP4, MOV, WebM. Max 20 MB.
        The answer has a `url` to open the file. With Cloudinary configured it is an `https://res.cloudinary.com/...` link;
        otherwise it is a path on this server (`/uploads/{filename}`), so put the server's address in front of it.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileRecord' }
        '400':
          description: No file, wrong type, or too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /uploads/{filename}:
    get:
      tags: [Files]
      summary: Download an uploaded file
      description: Only for files kept on this server's disk (when Cloudinary is not configured). Public link, protected only by the unguessable filename. Do not treat it as private storage.
      parameters:
        - { name: filename, in: path, required: true, schema: { type: string }, example: 3f2a9c1e-5b7d-4d3a-9d1e-0c2f6b8a7e41.png }
      responses:
        '200': { description: The file }
        '404': { description: Not found }

  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Home screen data
      description: Balance, next income, how much is safe to spend today, and the 5 most recent expenses.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/can-i-afford:
    post:
      tags: [Calculators]
      summary: Can I afford this purchase today?
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: '#/components/schemas/PositiveMoney' }
      responses:
        '200':
          description: Recommendation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanIAfford' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/forecast:
    post:
      tags: [Calculators]
      summary: Survival forecast - the chance your money lasts until the next income
      description: |
        Simulates the days until the next income 10,000 times. Bills fall on their due dates; daily spending is random and
        learned from the user's own last 60 days (a new user starts from sensible assumptions). From the simulated futures it
        answers: the chance of running out (`ruinProbability`), the largest purchase that keeps that chance under the chosen
        risk (`maxPurchaseNow`), and, when an `amount` is sent, the chance for that purchase and the worst-case shortfall.
        `ruinByDay` shows when in the period the danger is. The numbers are computed by the server, never by a language
        model, and are identical for repeated calls on the same day. "Running out" means the balance falling below the
        savings reserve. Only the next 90 days are forecast. The `averageMethod` field is the plain "balance divided by days"
        figure, for comparison.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { $ref: '#/components/schemas/PositiveMoney' }
                inDays: { type: integer, minimum: 0, maximum: 365, default: 0, description: 'Buy the item this many days from today (0 = today). Only used with amount.' }
                confidence: { type: number, minimum: 0.5, maximum: 0.99, default: 0.95, description: 'How sure to be. 0.95 means the chance of running out must stay at or under 5%.' }
            example: { amount: 40000, confidence: 0.95 }
      responses:
        '200':
          description: The forecast
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Forecast' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/assistant:
    post:
      tags: [Calculators]
      summary: Ask the AI assistant about a spending decision
      description: |
        Plain-language questions such as "Can I afford a 40000 phone?". The assistant (a language model) works out what is
        being asked and calls the survival forecast (`POST /api/forecast`) for the numbers; it never calculates anything
        itself. Every number in its reply is checked against the forecast results and the user's own message: if the reply
        contains any other number it is discarded and replaced by the forecast's own summary
        (`replacedUnverifiedReply: true`). `facts` holds what the forecast returned, so the app can show the raw numbers
        too. Only the message and the forecast numbers go to the AI service, never the name, email or password.
        Answers **503** when the server has no `ANTHROPIC_API_KEY`, and **502** when the AI service is down. Limited to
        10 calls a minute.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 500 }
            example: { message: Can I afford a phone that costs 40000? }
      responses:
        '200':
          description: The checked answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantReply' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: The AI service is unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The assistant is not set up on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/projected-balance:
    post:
      tags: [Calculators]
      summary: Monthly balance after a proposed EMI
      description: "Projected balance = income − ordinary expenses − existing EMI − proposed EMI. A negative result sets `isNegative` and a `warning`."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monthlyIncome]
              properties:
                monthlyIncome: { $ref: '#/components/schemas/Money' }
                ordinaryExpenses: { $ref: '#/components/schemas/Money' }
                existingEMI: { $ref: '#/components/schemas/Money' }
                proposedEMI: { $ref: '#/components/schemas/Money' }
            example: { monthlyIncome: 450000, ordinaryExpenses: 180000, existingEMI: 35000, proposedEMI: 50000 }
      responses:
        '200':
          description: Projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectedBalance' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/cash-flow:
    post:
      tags: [Calculators]
      summary: Month-by-month cash flow projection
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monthlyGrossIncome]
              properties:
                monthlyGrossIncome: { $ref: '#/components/schemas/Money' }
                otherMonthlyExpenses: { $ref: '#/components/schemas/Money' }
                existingMonthlyDebtPayments: { $ref: '#/components/schemas/Money' }
                monthlyPayment: { $ref: '#/components/schemas/Money' }
                startingCashBalance: { type: number, minimum: -1000000000000, maximum: 1000000000000, default: 0, description: May be negative (overdrawn). }
                months: { type: integer, minimum: 1, maximum: 120, default: 6 }
      responses:
        '200':
          description: Projection and summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashFlow' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/affordability:
    post:
      tags: [Calculators]
      summary: Loan affordability
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monthlyGrossIncome]
              properties:
                monthlyGrossIncome: { $ref: '#/components/schemas/Money' }
                otherMonthlyExpenses: { $ref: '#/components/schemas/Money' }
                existingMonthlyDebtPayments: { $ref: '#/components/schemas/Money' }
                proposedMonthlyPayment: { $ref: '#/components/schemas/Money' }
                targetDtiRatio: { type: number, minimum: 0, maximum: 1, default: 0.4, description: Maximum share of income going to debt. }
                annualInterestRate: { type: number, minimum: 0, maximum: 1, default: 0, description: 'A fraction, not a percentage: 0.12 means 12%.' }
                loanTermMonths: { type: integer, minimum: 1, maximum: 480, default: 12 }
      responses:
        '200':
          description: Affordability result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Affordability' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/analytics/summary:
    get:
      tags: [Analytics]
      summary: Spending summary for a date range
      description: |
        Totals, spending per category and a per-day or per-month series, for a range of UTC days (both ends included).
        Defaults to the last 30 days up to today. The range can be at most 731 days. Categories are grouped without
        regard to letter case. Periods with no spending are left out of `series`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, description: 'First day, e.g. 2026-10-01.', schema: { type: string, format: date } }
        - { name: to, in: query, description: 'Last day, e.g. 2026-10-31.', schema: { type: string, format: date } }
        - { name: groupBy, in: query, description: 'Bucket size of the series.', schema: { type: string, enum: [day, month], default: day } }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/alert-rules:
    get:
      tags: [Alerts]
      summary: List my alert rules
      description: Alerts are off until the user sets rules. There are no default rules.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlertRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    put:
      tags: [Alerts]
      summary: Set an alert rule
      description: |
        Creates the rule, or updates the user's existing rule of the same type (for `category_monthly_budget`, of the same
        category, compared without regard to letter case). What `threshold` means depends on `type`:

        | type | threshold | fires when |
        |---|---|---|
        | `low_balance` | an amount | balance is below it |
        | `daily_spend_limit` | an amount | spent today is above it |
        | `monthly_spend_limit` | an amount | spent this month is above it |
        | `category_monthly_budget` | an amount (also needs `category`) | spent on that category this month is above it |
        | `bill_due_soon` | a number of days, 1 to 60 | a bill is due within that many days (including today) |
        | `over_safe_to_spend` | none (sending one is a 400) | today's spending is above today's safe-to-spend figure |

        Days and months are UTC. A rule fires at most once per day (low balance, daily limit, safe-to-spend), once per
        month (monthly limit, category budget) or once per bill. Fields that do not apply to the type are rejected.
        At most 50 rules per user. The rule is checked right away.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleInput' }
      responses:
        '200':
          description: The saved rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRule' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: The user already has the maximum number of rules.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/alert-rules/{id}:
    delete:
      tags: [Alerts]
      summary: Delete an alert rule
      description: Alerts the rule already produced stay in the history.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such rule (or it is not yours)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/alerts:
    get:
      tags: [Alerts]
      summary: List my alerts (newest first)
      description: |
        Checks the user's rules first, so alerts that depend on the calendar (a bill coming due) show up without any
        other action. Rules are also checked after every change to the balance, bills, income, savings goal or expenses,
        so this list is current after any of those calls. Alerts are kept for 90 days.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: unread, in: query, description: 'Only unread alerts.', schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/alerts/read-all:
    post:
      tags: [Alerts]
      summary: Mark all my alerts as read
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: How many alerts were newly marked read
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer, example: 3 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/alerts/{id}/read:
    post:
      tags: [Alerts]
      summary: Mark one alert as read
      description: Safe to repeat; the first read time is kept.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: The alert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such alert (or it is not yours)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The `token` returned by register or login. Valid for 1 hour (`expiresIn` seconds); renew it with `POST /api/auth/refresh`.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Unique key per user action (e.g. a UUID). A retry with the same key and body returns the first result instead of repeating the action.
      schema: { type: string, maxLength: 128 }

  responses:
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    Unauthorized:
      description: Missing, invalid or expired token, or the account no longer exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit hit. Retry later.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: Something went wrong }

    ValidationError:
      type: object
      required: [error, details]
      properties:
        error: { type: string, example: Validation failed }
        details:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: amount }
              message: { type: string, example: amount must be greater than 0 }

    Health:
      type: object
      required: [status, database, redis]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [connected, down] }
        redis: { type: string, enum: [connected, memory] }

    Money:
      type: number
      minimum: 0
      maximum: 1000000000000
      example: 250.75
    PositiveMoney:
      type: number
      minimum: 0.01
      maximum: 1000000000000
      example: 99.99

    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254, description: 'ASCII only. Trimmed and lowercased by the server.' }
        password: { type: string, minLength: 8, description: 'At most 72 bytes (accented and non-Latin characters use 2-4 bytes each).' }
        name: { type: string, maxLength: 100, nullable: true, example: Jonathan Adewale, description: Optional display name. }
        phone: { type: string, nullable: true, example: '+91 98765 43210' }
    ProfileUpdateInput:
      type: object
      minProperties: 1
      description: Any of these fields; at least one. Other fields are ignored.
      properties:
        name: { type: string, maxLength: 100, nullable: true }
        phone: { type: string, nullable: true, example: '+234 801 234 5678' }
        email: { type: string, format: email, description: Needs currentPassword. }
        currentPassword: { type: string, description: Required when email is sent. }
    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8, description: 'At most 72 bytes, and different from the current one.' }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    User:
      type: object
      required: [id, email, name, phone, avatarUrl, accountStatus, deletionRequestedAt, deletesAt, balance, nextIncomeAmount, nextIncomeDate, savingsGoalAmount, savingsGoalDeadline, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string, nullable: true, description: The display name entered at sign-up. }
        accountStatus: { type: string, enum: [active, pending_deletion], description: '`pending_deletion` means the account will be permanently deleted at `deletesAt`; until then it still works and can be cancelled.' }
        deletionRequestedAt: { type: string, format: date-time, nullable: true, description: When deletion was requested. Null if the account is active. }
        deletesAt: { type: string, format: date-time, nullable: true, description: When the account and all its data will be permanently deleted (24 hours after the request). Null if the account is active. }
        phone: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true, description: 'The profile picture to show: a full https link, or a path such as `/uploads/abc.png` that needs the server address in front. Null if none.' }
        balance: { type: number }
        nextIncomeAmount: { type: number }
        nextIncomeDate: { type: string, format: date-time, nullable: true }
        savingsGoalAmount: { type: number }
        savingsGoalDeadline: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    FinancialProfileInput:
      type: object
      minProperties: 1
      description: Any of these fields; at least one.
      properties:
        monthlyIncome: { $ref: '#/components/schemas/Money' }
        monthlyExpenses: { $ref: '#/components/schemas/Money' }
        existingDebtPayments: { $ref: '#/components/schemas/Money' }
        proposedPayment: { $ref: '#/components/schemas/Money' }
        targetDtiRatio: { type: number, minimum: 0, maximum: 1, example: 0.4, description: Share of income you are willing to give to debt. }
        annualInterestRate: { type: number, minimum: 0, maximum: 1, example: 0.12, description: 'A fraction, not a percentage: 0.12 means 12%.' }
        loanTermMonths: { type: integer, minimum: 1, maximum: 480, example: 24 }
    FinancialProfile:
      type: object
      required: [monthlyIncome, monthlyExpenses, existingDebtPayments, proposedPayment, targetDtiRatio, annualInterestRate, loanTermMonths, updatedAt]
      properties:
        monthlyIncome: { type: number, example: 400000 }
        monthlyExpenses: { type: number, example: 150000 }
        existingDebtPayments: { type: number, example: 30000 }
        proposedPayment: { type: number, example: 50000 }
        targetDtiRatio: { type: number, example: 0.4 }
        annualInterestRate: { type: number, example: 0.18 }
        loanTermMonths: { type: integer, example: 24 }
        updatedAt: { type: string, format: date-time, nullable: true, description: 'When it was last saved. Null if the user never saved anything.' }
    AuthResponse:
      type: object
      required: [token, expiresIn, refreshToken, user]
      properties:
        token: { type: string, description: 'Send as `Authorization: Bearer <token>`. Short-lived.' }
        expiresIn: { type: integer, example: 3600, description: 'Seconds until `token` expires. Refresh shortly before that, or on the first 401.' }
        refreshToken: { type: string, description: 'Keep it somewhere safe. Trade it for a new token at `POST /api/auth/refresh` once `token` has expired.' }
        user: { $ref: '#/components/schemas/User' }
        accountDeletion: { $ref: '#/components/schemas/AccountDeletionNotice' }
    AccountDeletionNotice:
      type: object
      nullable: true
      description: Null for an active account. For one waiting to be deleted, the notice to show (for example as a banner).
      required: [requestedAt, deletesAt, message]
      properties:
        requestedAt: { type: string, format: date-time }
        deletesAt: { type: string, format: date-time }
        message: { type: string }
    AccountDeletionPending:
      type: object
      required: [accountStatus, graceHours, requestedAt, deletesAt, message]
      properties:
        accountStatus: { type: string, enum: [pending_deletion] }
        graceHours: { type: integer, example: 24 }
        requestedAt: { type: string, format: date-time }
        deletesAt: { type: string, format: date-time }
        message: { type: string, description: A sentence that can be shown as it is. }
    TokenPair:
      type: object
      required: [token, expiresIn, refreshToken]
      properties:
        token: { type: string }
        expiresIn: { type: integer, example: 3600 }
        refreshToken: { type: string, description: The new refresh token. The one you sent no longer works. }
    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token: { type: string, description: The token from the reset email. }
        password: { type: string, minLength: 8, description: At most 72 bytes. }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, example: true }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }

    BillInput:
      type: object
      required: [name, amount]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Rent }
        amount: { $ref: '#/components/schemas/PositiveMoney' }
        dueDate: { type: string, format: date-time, nullable: true, example: '2026-11-01' }
    Bill:
      type: object
      required: [id, userId, name, amount, dueDate, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        amount: { type: number }
        dueDate: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ExpenseInput:
      type: object
      required: [amount]
      properties:
        amount: { $ref: '#/components/schemas/PositiveMoney' }
        category: { type: string, maxLength: 50, default: Other, example: Food }
        description: { type: string, maxLength: 200, default: '' }
        date: { type: string, format: date-time, description: Defaults to now. }
    Expense:
      type: object
      required: [id, userId, amount, category, description, date, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        amount: { type: number }
        category: { type: string }
        description: { type: string }
        date: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    ExpenseUpdate:
      type: object
      minProperties: 1
      description: Any of these fields; at least one.
      properties:
        amount: { $ref: '#/components/schemas/PositiveMoney' }
        category: { type: string, minLength: 1, maxLength: 50 }
        description: { type: string, maxLength: 200 }
        date: { type: string, format: date-time }

    AnalyticsSummary:
      type: object
      required: [from, to, groupBy, days, totalSpent, transactionCount, averageDailySpend, topCategory, byCategory, series]
      properties:
        from: { type: string, format: date, example: '2026-10-01' }
        to: { type: string, format: date, example: '2026-10-31' }
        groupBy: { type: string, enum: [day, month] }
        days: { type: integer, description: 'Number of days in the range, both ends included.' }
        totalSpent: { type: number }
        transactionCount: { type: integer }
        averageDailySpend: { type: number, description: totalSpent divided by days. }
        topCategory: { type: string, nullable: true, description: 'The category with the most spending, or null when nothing was spent.' }
        byCategory:
          type: array
          description: Largest first.
          items:
            type: object
            required: [category, total, count, percent]
            properties:
              category: { type: string }
              total: { type: number }
              count: { type: integer }
              percent: { type: number, description: 'Share of totalSpent, one decimal.' }
        series:
          type: array
          description: Oldest first. Periods without spending are left out.
          items:
            type: object
            required: [period, total, count]
            properties:
              period: { type: string, description: 'YYYY-MM-DD when grouped by day, YYYY-MM by month.', example: '2026-10-22' }
              total: { type: number }
              count: { type: integer }

    AlertRuleInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [low_balance, daily_spend_limit, monthly_spend_limit, category_monthly_budget, bill_due_soon, over_safe_to_spend]
        threshold:
          type: number
          description: Required for every type except over_safe_to_spend, where it must be left out. Days (1 to 60) for bill_due_soon, an amount (at least 0.01) otherwise.
        category: { type: string, maxLength: 50, description: 'Required for category_monthly_budget and not allowed for other types.' }
        enabled: { type: boolean, default: true }
    AlertRule:
      type: object
      required: [id, userId, type, threshold, category, enabled, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type:
          type: string
          enum: [low_balance, daily_spend_limit, monthly_spend_limit, category_monthly_budget, bill_due_soon, over_safe_to_spend]
        threshold: { type: number, nullable: true }
        category: { type: string, nullable: true }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Alert:
      type: object
      required: [id, userId, ruleId, type, message, data, periodKey, createdAt, readAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        ruleId: { type: string, format: uuid, nullable: true, description: 'Null once the rule that produced it was deleted.' }
        type:
          type: string
          enum: [low_balance, daily_spend_limit, monthly_spend_limit, category_monthly_budget, bill_due_soon, over_safe_to_spend]
        message: { type: string, description: A sentence that can be shown as is. }
        data: { type: object, additionalProperties: true, description: 'The numbers behind the message, for custom displays. The fields depend on the type.' }
        periodKey: { type: string, description: 'The day, month or bill this alert is for. Informational.' }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
    AlertList:
      type: object
      required: [alerts, unreadCount, total]
      properties:
        alerts:
          type: array
          items: { $ref: '#/components/schemas/Alert' }
        unreadCount: { type: integer, description: 'All unread alerts, not just this page.' }
        total: { type: integer, description: 'Alerts matching the filter, across all pages.' }

    FileRecord:
      type: object
      required: [id, userId, filename, originalName, mimetype, size, url, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        filename: { type: string, description: 'The stored name (without a folder).' }
        originalName: { type: string }
        mimetype: { type: string }
        size: { type: integer, description: Bytes. }
        url: { type: string, description: 'Where to open the file: a full https link when it is kept on Cloudinary, or a path such as `/uploads/9f2c.png` when it is kept on this server.' }
        publicId: { type: string, nullable: true, description: 'Cloudinary id. Null for files kept on this server.' }
        resourceType: { type: string, nullable: true, description: 'Cloudinary type (image or video). Null for files kept on this server.' }
        createdAt: { type: string, format: date-time }

    SafeToSpend:
      type: object
      required: [dailySafeToSpend, remainingToday, daysUntilNextIncome, upcomingBillsTotal, savingsReserve, availableAfterCommitments, spentToday, warnings]
      properties:
        dailySafeToSpend: { type: number, description: 'Balance plus what was already spent today (so spending is not counted twice), minus upcoming bills and savings reserve, divided by days until next income. Never negative. Steady through the day.' }
        remainingToday: { type: number, description: dailySafeToSpend minus what was already spent today. Negative means over budget. }
        daysUntilNextIncome: { type: integer, minimum: 1 }
        upcomingBillsTotal: { type: number }
        savingsReserve: { type: number }
        availableAfterCommitments: { type: number }
        spentToday: { type: number }
        warnings: { type: array, items: { type: string } }
    Dashboard:
      type: object
      required: [user, safeToSpend, survival, recentExpenses, unreadAlerts]
      properties:
        survival: { $ref: '#/components/schemas/ForecastBrief' }
        user:
          type: object
          required: [balance, nextIncomeAmount, nextIncomeDate, savingsGoalAmount]
          properties:
            balance: { type: number }
            nextIncomeAmount: { type: number }
            nextIncomeDate: { type: string, format: date-time, nullable: true }
            savingsGoalAmount: { type: number }
        safeToSpend: { $ref: '#/components/schemas/SafeToSpend' }
        recentExpenses:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/Expense' }
        unreadAlerts: { type: integer, description: 'Alerts the user has not marked as read.' }
        accountDeletion: { $ref: '#/components/schemas/AccountDeletionNotice' }

    CanIAfford:
      type: object
      required: [recommendation, reason, explanation, remainingAfterPurchase, cashFlowWarnings, safeToSpend, forecast]
      properties:
        forecast: { $ref: '#/components/schemas/ForecastBrief' }
        recommendation: { type: string, enum: [Safe, ThinkTwice, NotRecommended] }
        reason: { type: string }
        explanation: { type: string }
        remainingAfterPurchase: { type: number }
        cashFlowWarnings: { type: array, items: { type: string } }
        safeToSpend: { $ref: '#/components/schemas/SafeToSpend' }

    AssistantReply:
      type: object
      required: [reply, facts, checked, replacedUnverifiedReply]
      properties:
        reply: { type: string, description: 'The answer to show the user.' }
        facts:
          type: array
          description: 'Every forecast the assistant asked for, with its input and the numbers returned. Empty if it needed no numbers (for example it asked for the amount).'
          items:
            type: object
            required: [tool, input, result]
            properties:
              tool: { type: string, enum: [forecast] }
              input: { type: object }
              result: { type: object }
        checked: { type: boolean, description: 'Always true: the reply was checked against the numbers.' }
        replacedUnverifiedReply: { type: boolean, description: 'True when the first reply contained a number that did not come from the forecast, so the forecast summary was used instead.' }
    ForecastBrief:
      type: object
      required: [confidence, survivalProbability, ruinProbability, maxPurchaseNow, nextIncomeDate, dataQuality, purchase, summary]
      description: 'The short form of the survival forecast. The full one is POST /api/forecast.'
      properties:
        confidence: { type: number }
        survivalProbability: { type: number, minimum: 0, maximum: 1 }
        ruinProbability: { type: number, minimum: 0, maximum: 1 }
        maxPurchaseNow: { type: number, minimum: 0 }
        nextIncomeDate: { type: string }
        dataQuality: { type: string, enum: [default, blended, history], description: 'default means no spending history yet, so the estimate is rough.' }
        purchase: { $ref: '#/components/schemas/ForecastPurchase' }
        summary: { type: string }
    ForecastPurchase:
      nullable: true
      type: object
      required: [amount, inDays, ruinProbability, survivalProbability, expectedShortfallInWorstCase, verdict]
      properties:
        amount: { type: number }
        inDays: { type: integer }
        ruinProbability: { type: number, minimum: 0, maximum: 1 }
        survivalProbability: { type: number, minimum: 0, maximum: 1 }
        expectedShortfallInWorstCase: { type: number, minimum: 0 }
        verdict: { type: string, enum: [Safe, ThinkTwice, NotRecommended] }
    ForecastRuinDay:
      type: object
      required: [inDays, date, ruinProbability]
      properties:
        inDays: { type: integer, minimum: 0 }
        date: { type: string, description: 'The UTC date (YYYY-MM-DD).' }
        ruinProbability: { type: number, minimum: 0, maximum: 1, description: 'Cumulative: the chance of having run out on or before this day.' }
    Forecast:
      type: object
      required: [confidence, horizonDays, nextIncomeDate, survivalProbability, ruinProbability, maxPurchaseNow, averageMethod, purchase, ruinByDay, model, summary, warnings, disclaimer]
      properties:
        confidence: { type: number }
        horizonDays: { type: integer, minimum: 1, description: 'Days simulated (up to 90).' }
        nextIncomeDate: { type: string, description: 'UTC date (YYYY-MM-DD).' }
        survivalProbability: { type: number, minimum: 0, maximum: 1, description: 'Chance of reaching the next income without going under the savings reserve, with no new purchase.' }
        ruinProbability: { type: number, minimum: 0, maximum: 1, description: 'One minus survivalProbability.' }
        maxPurchaseNow: { type: number, minimum: 0, description: 'The largest one-off purchase today that keeps the chance of running out at or under 1 - confidence.' }
        averageMethod:
          type: object
          required: [dailySafeToSpend, daysUntilNextIncome]
          description: 'The plain average figure (balance after commitments divided by days), for comparison.'
          properties:
            dailySafeToSpend: { type: number }
            daysUntilNextIncome: { type: integer }
        purchase:
          nullable: true
          description: 'Present only when amount was sent.'
          type: object
          required: [amount, inDays, ruinProbability, survivalProbability, expectedShortfallInWorstCase, verdict]
          properties:
            amount: { type: number }
            inDays: { type: integer }
            ruinProbability: { type: number, minimum: 0, maximum: 1 }
            survivalProbability: { type: number, minimum: 0, maximum: 1 }
            expectedShortfallInWorstCase: { type: number, minimum: 0, description: 'Average amount below the savings reserve in the worst (1 - confidence) share of futures.' }
            verdict: { type: string, enum: [Safe, ThinkTwice, NotRecommended], description: 'Safe: within the chosen risk. ThinkTwice: up to three times it (at most 50%). Otherwise NotRecommended.' }
        ruinByDay:
          type: array
          description: 'The chance of having run out on or before each day up to and including the income day, with the purchase when amount was sent. Never decreases. Shows when the danger is; good for a chart.'
          items: { $ref: '#/components/schemas/ForecastRuinDay' }
        model:
          type: object
          required: [source, observedDays, meanDailySpend, zeroSpendDayShare, paths]
          properties:
            source: { type: string, enum: [default, blended, history], description: 'default: no history yet. blended: some history mixed with starting assumptions. history: 28 or more days of the user own data.' }
            observedDays: { type: integer }
            meanDailySpend: { type: number }
            zeroSpendDayShare: { type: number }
            paths: { type: integer }
        summary: { type: string, description: 'One plain sentence for the user, built from the numbers above.' }
        warnings: { type: array, items: { type: string } }
        disclaimer: { type: string }

    ProjectedBalance:
      type: object
      required: [monthlyIncome, ordinaryExpenses, existingEMI, proposedEMI, projectedBalance, shortfall, isNegative, warning]
      properties:
        monthlyIncome: { type: number }
        ordinaryExpenses: { type: number }
        existingEMI: { type: number }
        proposedEMI: { type: number }
        projectedBalance: { type: number, description: Can be negative. }
        shortfall: { type: number, description: How much commitments exceed income; 0 when not negative. }
        isNegative: { type: boolean }
        warning: { type: string, nullable: true, description: Human-readable message when negative or exactly zero; otherwise null. }

    CashFlow:
      type: object
      required: [projection, summary]
      properties:
        projection:
          type: array
          items:
            type: object
            required: [month, startingBalance, income, debtPayments, otherExpenses, endingBalance, isNegative]
            properties:
              month: { type: integer }
              startingBalance: { type: number }
              income: { type: number }
              debtPayments: { type: number }
              otherExpenses: { type: number }
              endingBalance: { type: number }
              isNegative: { type: boolean }
        summary:
          type: object
          required: [totalMonths, negativeMonths, lowestEndingBalance, warnings]
          properties:
            totalMonths: { type: integer }
            negativeMonths: { type: array, items: { type: integer } }
            lowestEndingBalance: { type: number }
            warnings: { type: array, items: { type: string } }

    Affordability:
      allOf:
        - $ref: '#/components/schemas/ProjectedBalance'
        - type: object
          required: [maxAffordableMonthlyPayment, maxAffordableLoanAmount, debtToIncomeRatio, isAffordable, warnings]
          properties:
            maxAffordableMonthlyPayment: { type: number }
            maxAffordableLoanAmount: { type: number }
            debtToIncomeRatio: { type: number, description: 'Fraction: 0.15 means 15% of income goes to debt.' }
            isAffordable: { type: boolean }
            warnings: { type: array, items: { type: string } }
